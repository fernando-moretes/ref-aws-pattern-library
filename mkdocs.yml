# Gerado por fernando-moretes/platform (TechDocs do Backstage). O conteudo e do
# repositorio: escreva em docs/*.md; este arquivo so lista as paginas.
site_name: ref-aws-pattern-library
site_description: "A curated catalog of 22+ AWS reference architectures with diagrams, ADRs, Well-Architected pointers and cost notes."
repo_url: https://github.com/fernando-moretes/ref-aws-pattern-library
edit_uri: edit/main/docs/
docs_dir: docs
plugins:
  - techdocs-core
nav:
  - Visão geral: index.md
  - Arquitetura: arquitetura.md
  - Operação: operacao.md
  - API: api.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
